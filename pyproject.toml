[project]
name = "qucs-s-mcp"
version = "0.1.0"
description = "MCP server to drive the Qucs-S circuit simulator (ngspice) from AI agents, with schematic snapshots"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "resvg-py>=0.5.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
qucs-s-mcp = "qucs_s_mcp.server:main"
